[package]
name = "mcp-session-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP session store + guard helpers (parity with Mcp-Session-Id lifecycle in streamable HTTP)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mcp-stdio = { path = "../mcp-stdio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
