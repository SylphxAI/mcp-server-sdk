[package]
name = "mcp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP app/server state product builders (parity with src/app/app.ts + src/server/server.ts)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mcp-builders = { path = "../mcp-builders" }
mcp-protocol = { path = "../mcp-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
